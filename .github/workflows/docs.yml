name: Docs

# Builds the Sphinx docs and deploys them to GitHub Pages.
# Runs on demand (Actions → Docs → Run workflow) for documentation-only
# updates between releases, and is called by release.yml on every release.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  docs:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[msgraph,gmail]"
          pip install sphinx sphinx_rtd_theme "myst-parser[linkify]"

      - name: Build docs
        run: sphinx-build -b html docs docs/_build/html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
